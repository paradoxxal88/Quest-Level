<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Level 1</title>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- bootstrap-icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-image: linear-gradient(to right, purple, pink);
      }

      .container {
        margin-top: 50px;
        background-color: rgb(210, 201, 190);
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 20px 15px rgb(22, 21, 21);
      }

      .card {
        background-color: rgba(174, 87, 163, 0.292);
        border-radius: 15px;
      }

      .btn:hover {
        background-color: #886688;
        color: white;
      }

      .lvl-up {
        background-color: rgba(19, 181, 19, 0.821);
      }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
          <div class="card shadow-lg">
            <div class="card-body">
              <span class="badge bg-primary" id="levelBadge"
                ><i class="bi bi-bar-chart-steps"></i>Level 3</span
              >
              <h1 class="h4 fw-bold mt-2">
                Web Dev Mini-Quest (JavaScript: Level Up)
              </h1>
              <p class="small mb-4">Click button to increase level.</p>

              <button
                class="btn lvl-up btn-primary w-100 mb-3"
                id="levelbtn"
                onclick="levelUp()"
              >
                <i class="bi bi-arrow-up-circle-fill"></i> Level up
              </button>

              <div class="d-flex gap-2">
                <button
                  class="btn btn-dark w-50"
                  onclick="window.location.href = 'level2.html'"
                >
                  <i class="bi bi-arrow-left"></i>
                  Back
                </button>
                <button
                  class="btn btn-primary w-50"
                  onclick="window.location.href = 'level4.html'"
                >
                  <i class="bi bi-arrow-right"></i>
                  Next Level
                </button>
              </div>
            </div>
          </div>

          <p class="text-center text-muted small mt-3 mb-0">
            Screenshot #3: Click “Level Up” first, then screenshot (badge should
            change).
          </p>
        </div>
      </div>
    </div>

    <!-- levelup script -->
    <!-- <script>
      let level = 3;

      function levelUp() {
        level++;
        document.getElementById("levelBadge").innerHTML =
          '<i class="bi bi-bar-chart-steps"></i> Level' + level;
      }
    </script> -->

    <script>
      let level = 3;
      const maxLevel = 6;

      function levelUp() {
        if (level < maxLevel) {
          level++;
          document.getElementById("levelBadge").innerHTML =
            '<i class="bi bi-bar-chart-steps"></i> Level ' + level;
        }

        if (level === maxLevel) {
          const btn = document.getElementById("levelbtn");

          btn.disabled = true;
          btn.innerHTML = "Max Level Reached";
        }
      }
    </script>
  </body>
</html>

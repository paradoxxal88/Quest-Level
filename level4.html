<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Level 1</title>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <style>
      body {
        background-image: linear-gradient(to right, purple, pink);
      }

      .container {
        margin-top: 50px;

        background-color: rgb(210, 201, 190);
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 20px 15px rgb(22, 21, 21);
      }

      .card {
        background-color: rgba(174, 87, 163, 0.292);
        border-radius: 15px;
      }

      .btn:hover {
        background-color: #886688;
        color: white;
        transform: scale(1);
      }

      #submitbtn {
        border-radius: 5px;
        background-color: rgba(107, 167, 18, 0.841);
      }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
          <div class="card shadow-lg">
            <div class="card-body">
              <span class="badge bg-primary">Level 4</span>
              <h1 class="h4 fw-bold mt-2">
                Web Dev Mini-Quest (Form Validation)
              </h1>
              <p class="fs-6 mb-3">
                Enter a name. Empty = error, filled = success.
              </p>
              <label for="heroName" class="form-label">Hero Name</label>
              <input
                type="text"
                class="form-control"
                id="heroName"
                placeholder="Type your name here.."
              />
              <button class="btn btn-primary w-100 mt-2" id="submitbtn">
                Submit
              </button>

              <p id="result" class="mt-3 mb-0"></p>
              <hr />
              <div class="d-flex gap-2">
                <button
                  class="btn btn-dark w-50"
                  onclick="window.location.href = 'level3.html'"
                >
                  Back
                </button>
                <button
                  class="btn btn-primary w-50"
                  onclick="window.location.href = 'level5.html'"
                >
                  Next Level
                </button>
              </div>
            </div>
          </div>

          <p class="text-center text-muted small mt-3 mb-0">
            Screenshot #4: Show the GREEN success message with your name.
          </p>
        </div>
      </div>
    </div>

    <!-- Scripting for submission -->
    <script>
      const submitBtn = document.getElementById("submitbtn");
      const heroNameInput = document.getElementById("heroName");
      const result = document.getElementById("result");

      submitBtn.addEventListener("click", function () {
        const nameValue = heroNameInput.value.trim();

        if (nameValue === "") {
          result.textContent = "Error: Name cannot be empty.";
          result.style.color = "red";
        } else {
          result.textContent = "Success! Welcome, " + nameValue + "!";
          result.style.color = "green";
        }
      });
    </script>
  </body>
</html>

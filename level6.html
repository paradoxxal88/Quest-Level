<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Level 6</title>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <style>
      body {
        background-image: linear-gradient(to right, purple, pink);
      }

      .container {
        margin-top: 50px;
        background-color: rgb(210, 201, 190);
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 20px 15px rgb(22, 21, 21);
      }

      .card {
        background-color: rgba(174, 87, 163, 0.292);
        border-radius: 15px;
      }

      .btn:hover {
        background-color: #886688;
        color: white;
        transform: scale(1);
      }

      .door-btn {
        font-size: 1.5rem;
        padding: 20px 30px;
        margin: 5px;
        flex: 1;
        max-width: 200px;
      }

      .result-message {
        font-size: 1.2rem;
        font-weight: bold;
        padding: 15px;
        border-radius: 10px;
        margin: 20px 0;
        display: none;
      }

      .success {
        background-color: #d4edda;
        color: #155724;
        border: 2px solid #c3e6cb;
      }

      .error {
        background-color: #f8d7da;
        color: #721c24;
        border: 2px solid #f5c6cb;
      }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
          <div class="card shadow-lg">
            <div class="card-body">
              <span class="badge bg-primary">Level 6</span>
              <h1 class="h4 fw-bold mt-2">Web Dev Mini-Quest (Conditionals)</h1>
              <p class="small mb-4">
                Choose the correct door to escape! Only one door leads to
                freedom.
              </p>

              <div class="text-center">
                <p class="fw-bold">Choose a door:</p>
                <div class="d-flex justify-content-center flex-wrap">
                  <button
                    class="btn btn-success door-btn"
                    onclick="checkDoor(1)"
                  >
                    <i class="bi bi-door-closed-fill"></i> Door 1
                  </button>
                  <button
                    class="btn btn-warning door-btn"
                    onclick="checkDoor(2)"
                  >
                    <i class="bi bi-door-closed-fill"></i> Door 2
                  </button>
                  <button
                    class="btn btn-danger door-btn"
                    onclick="checkDoor(3)"
                  >
                    <i class="bi bi-door-closed-fill"></i> Door 3
                  </button>
                </div>

                <div id="resultMessage" class="result-message"></div>
              </div>

              <div class="d-flex gap-2">
                <button
                  class="btn btn-dark w-50"
                  onclick="window.location.href = 'level5.html'"
                >
                  Back
                </button>
                <button
                  class="btn btn-primary w-50"
                  onclick="window.location.href = 'level1.html'"
                >
                  Restart
                </button>
              </div>
            </div>
          </div>

          <p class="text-center text-muted small mt-3 mb-0">
            Screenshot #6: Door result message shown.
          </p>
        </div>
      </div>
    </div>

    <script>
      const correctDoor = 2;

      function checkDoor(doorNumber) {
        const resultDiv = document.getElementById("resultMessage");

        if (doorNumber === correctDoor) {
          resultDiv.textContent =
            "Success! You found the correct door and escaped!";
          resultDiv.className = "result-message success";
        } else {
          resultDiv.textContent = "Wrong door! Try again or restart.";
          resultDiv.className = "result-message error";
        }

        resultDiv.style.display = "block";
      }
    </script>
  </body>
</html>
